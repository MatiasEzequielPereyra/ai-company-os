name: Release validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/release-validation.yml"
      - "package.json"
      - "pyproject.toml"
      - "npm-bin/**"
      - "src/**"
      - ".agents/**"
      - "scripts/**"
      - "schemas/**"
      - ".codex/**"
      - "templates/**"
      - "AGENTS.md"
      - "README.md"
      - "INSTALL-QUICKSTART.txt"
      - "tasks/README.md"
      - "test-project/tests/test-npm-package-contract.ps1"
      - "test-project/tests/test-npm-package-e2e.ps1"
      - "test-project/tests/test-release-version-contract.ps1"

permissions:
  contents: read

jobs:
  release-candidate:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Use Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate release version contract
        shell: powershell
        run: .\test-project\tests\test-release-version-contract.ps1

      - name: Install Python test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile Python package
        shell: pwsh
        run: python -m compileall -q src/company_os

      - name: Run Python tests
        shell: pwsh
        run: python -m pytest -q

      - name: Run npm package tests
        shell: pwsh
        run: npm test

      - name: Run full PowerShell smoke suite
        shell: powershell
        run: .\test-project\tests\run-all-smoke-tests.ps1

      - name: Verify clean source checkout
        shell: pwsh
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) {
            throw "git diff --check failed."
          }

          $dirty = @(git status --porcelain --untracked-files=all)
          if ($LASTEXITCODE -ne 0) {
            throw "git status failed."
          }

          if ($dirty.Count -gt 0) {
            Write-Host "Release validation left the checkout dirty:"
            $dirty | ForEach-Object { Write-Host $_ }
            throw "Release validation must package a clean source checkout."
          }

      - name: Build release tarball
        id: pack
        shell: pwsh
        run: |
          $artifactDir = Join-Path $env:RUNNER_TEMP "aico-release-artifact"
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null

          $packOutput = @(npm pack --json --ignore-scripts --pack-destination $artifactDir)
          if ($LASTEXITCODE -ne 0) {
            throw "npm pack failed with exit code $LASTEXITCODE."
          }

          $pack = ($packOutput -join [Environment]::NewLine) | ConvertFrom-Json
          $entry = @($pack)[0]
          if ($null -eq $entry -or [string]::IsNullOrWhiteSpace([string]$entry.filename)) {
            throw "npm pack did not report an artifact filename."
          }

          $tarball = Join-Path $artifactDir ([string]$entry.filename)
          if (-not (Test-Path $tarball -PathType Leaf)) {
            throw "Expected release tarball was not created: $tarball"
          }

          $package = Get-Content .\package.json -Raw -Encoding UTF8 | ConvertFrom-Json

          "tarball=$tarball" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "filename=$($entry.filename)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "version=$($package.version)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

          Write-Host "Prepared release artifact: $($entry.filename)"
          Write-Host "Package version: $($package.version)"

      - name: Exercise exact packed artifact
        shell: pwsh
        run: |
          .\test-project\tests\test-npm-package-e2e.ps1 -TarballPath "${{ steps.pack.outputs.tarball }}"

      - name: Upload validated release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-company-os-${{ steps.pack.outputs.version }}-${{ github.sha }}
          path: ${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 7
