[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-company-os-cli"
version = "0.1.0"
description = "CLI interface for AI Company OS"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
  "rich>=14.2,<16",
  "textual>=0.80",
  "keyring>=25",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
company = "company_os.cli.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/company_os"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

